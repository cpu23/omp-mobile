name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run check
      - name: Run unit tests
        run: bun run test
      - name: Build mobile server
        run: bun run build
      - name: Install Chromium for browser acceptance
        if: matrix.os == 'ubuntu-latest'
        run: bunx playwright install --with-deps chromium
      - name: Run browser acceptance
        if: matrix.os == 'ubuntu-latest'
        run: bun run scripts/composer-selection.browser.ts
